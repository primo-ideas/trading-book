name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Lua 5.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # lupa 2.0 is the first version to ship the lupa.lua51 module tests/run.py imports.
      - name: Install lupa
        run: python -m pip install "lupa>=2.0"

      - name: Run the test suite
        run: python tests/run.py
